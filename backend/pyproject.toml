[project]
name = "semantic-search"
version = "1.0.0"
description = "Smart City Semantic Search System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "langgraph>=0.0.20",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "neo4j>=5.11.0",
    "pymilvus>=2.3.0",
    "pyodbc>=5.0.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
semantic = "app.main:run"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
